        chapters: {gunderson: [42]}
      - id: hn_salivary
        label: "Salivary glands"
        chapters: {gunderson: [43]}
      - id: hn_neck
        label: "Neck nodes & unknown H&N primary"
        chapters: {gunderson: [45, 46]}
      - id: hn_general
        label: "Head & neck (general)"
        chapters: {gunderson: [37], devita: [44, 45, 46], mdanderson: [6]}

