# Organ-system / pathology map for the indexed books.
#
# Every chunk is tagged with exactly one `pathology`, which rolls up to one
# `organ_system`. The portal's left-hand selector uses this to restrict both
# question-answering and the topic locator to a single disease area.
#
# Assignment is by CHAPTER, using the page ranges in the PDFs' own embedded
# outlines. That makes it auditable and stable: a chapter is a thing the
# publisher defined, not a keyword heuristic that drifts when the lexicon
# changes.
#
# Rules:
#   * Chapter numbers are per book and must not overlap between pathologies.
#     scripts/05_tag_pathologies.py fails loudly if they do.
#   * Pages in no listed chapter fall through to `general` -- radiobiology,
#     physics, molecular biology of cancer, prevention, supportive care. That
#     material is real and indexed; it just is not a disease site.
#   * Classification follows PATHOLOGY, not the book's own table of contents,
#     where the two disagree. Gunderson files thyroid cancer under head and
#     neck because that is where it is irradiated; it is tagged endocrine here
#     because that is what it is. Same for Gunderson ch.47/48 (skin) and
#     ch.80 (a bone sarcoma, but a paediatric one).

systems:
  - id: head_neck
    label: "Head & Neck"
    pathologies:
      - id: hn_oral_cavity
        label: "Oral cavity & tongue"
        chapters: {gunderson: [38]}
        # DeVita treats the whole of head and neck in one chapter (45), so
        # there is no chapter boundary to split the tongue out with. Stage 1
        # already scored every section against the tongue lexicon and marked
        # the tongue-specific ones tier "core"; this reuses that judgement
        # rather than inventing a second one.
        refine_from_devita_45_core: true
      - id: hn_oropharynx
        label: "Oropharynx & base of tongue"
        chapters: {gunderson: [39]}
      - id: hn_nasopharynx
        label: "Nasopharynx"
        chapters: {gunderson: [40]}
