; llama.cpp router presets -- every model the platform can ask for.
;
; scripts/serve_llm.sh starts ONE llama-server in router mode with
; --models-max 1. Each section below is a model the portal can request by
; name; the router loads it on demand and, because at most one may be
; resident, unloads whichever model was loaded before. So:
;
;   asking a question on the Oncology Reference page   -> reference model in RAM
;   generating a draft in Content Studio              -> writer model in RAM,
;                                                        reference model gone
;
; Measured on the target CPU: swapping into a 4B writer takes ~10 s cold and
; ~4 s back to the 3B reference model. Resident sizes (model + KV cache):
; 3B reference 3.4 GB, 4B writer 5.0 GB at 8k context / ~4.4 GB at 6k.
;
; Section names must match `llm.model` in config/rag.yaml and the `id`
; fields in config/writer.yaml. Relative paths resolve from the repo root,
; which serve_llm.sh cds to. Keys are llama-server's long option names
; without the leading dashes.

[*]
; 6 physical cores. Generation is memory-bandwidth bound and gets slower with
; the SMT siblings; prompt prefill is compute bound and benefits from them.
threads = 6
threads-batch = 12
; One user, one conversation: extra slots only split the KV cache.
parallel = 1
no-webui = true

; --- Oncology Reference (Ask mode) -------------------------------------------
[qwen2.5-3b-instruct]
model = models/gguf/Qwen2.5-3B-Instruct-Q4_K_M.gguf
ctx-size = 8192
; The reference system prompt is constant, so reuse its KV prefix across
; questions instead of re-reading ~1,100 tokens every time.
cache-reuse = 256

; Smaller reference option: ./start --model 1.5b
[qwen2.5-1.5b-instruct]
model = models/gguf/Qwen2.5-1.5B-Instruct-Q4_K_M.gguf
ctx-size = 8192
cache-reuse = 256

; --- Content Studio ----------------------------------------------------------
; 6k context covers the longest draft (1000 words ~= 1,800 tokens) plus the
; brief with room to spare, and costs ~0.6 GB less than 8k.
[qwen3-4b-instruct]
model = models/gguf/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
ctx-size = 6144

[qwen3.5-4b]
model = models/gguf/Qwen3.5-4B-Q4_K_M.gguf
ctx-size = 6144
