# Source-book registry for the tongue-cancer corpus extraction (Stage 1).
#
# All page numbers are 1-based PDF page numbers (what you type into a PDF
# viewer's "go to page" box), NOT the printed page numbers in the book.
# The two differ: e.g. Gunderson PDF page 872 carries printed page 612.

books:
  - id: devita
    title: "DeVita, Hellman & Rosenberg's Cancer: Principles & Practice of Oncology"
    short: "DeVita"
    path: "data/DeVita_Hellman_and_Rosenbergs_Cancer.pdf"
    pages: 4360

    # Layout: single-column prose. No printed page numbers in the text layer,
    # so citations fall back to the PDF page number.
    has_printed_page_numbers: false

    # Watermark stamped on 2129 of the 4360 pages.
    strip_patterns:
      - "Dr\\. AVR @ TMH"

    # Section 1 "Cancer of the Head and Neck" -- chapters 44, 45, 46.
    # Verified: p985 section divider, p986 ch.44 opener, p998 ch.45 opener,
    # p1097 ch.46 opener, p1113 next section divider.
    windows:
      - {start: 985, end: 1112, label: "Section 1: Cancer of the Head and Neck"}

    # Hard exclusions. The back-of-book index matches the tongue lexicon
    # constantly ("Tongue cancer, 1026-1030") and would poison retrieval.
    exclude_windows:
      - {start: 4270, end: 4360, label: "Back-of-book index"}
      - {start: 1, end: 120, label: "Front matter / contributors / TOC"}

    # NOTE: this hand-written map is now only a FALLBACK. Stage 1 derives the
    # chapter boundaries from the PDF's own embedded outline (145 chapters for
    # this book), because a partial hand-written map is actively dangerous in
    # full-book mode: pages outside it get no chapter, and every chunk on them
    # inherited whichever chapter was last set -- mislabelling 75% of DeVita's
    # citations as "ch.46 Rehabilitation After Treatment of Head and Neck
    # Cancer". Set `use_pdf_outline: false` to force these values instead.
    #
    # The boundaries below were read off the PDF directly and cover only the
    # head & neck chapters, which was sufficient when only those were indexed.
    chapter_map:
      - {num: 44, title: "The Molecular Biology of Head and Neck Cancers", start: 986, end: 997}
      - {num: 45, title: "Cancer of the Head and Neck", start: 998, end: 1096}
      - {num: 46, title: "Rehabilitation After Treatment of Head and Neck Cancer", start: 1097, end: 1112}

  - id: gunderson
    title: "Gunderson & Tepper's Clinical Radiation Oncology"
    short: "Gunderson"
    path: "data/GUNDERSON AND TEPPER'S.pdf"
    pages: 2300

    # Layout: two-column. MUST be extracted in reading order -- pdftotext
    # -layout interleaves the columns and drops figure labels mid-sentence.
    has_printed_page_numbers: true

    strip_patterns: []

    # Section III head & neck chapters 37-46, verified by running-header scan:
    #   37 Overview                     848-859
    #   38 Oral Cavity                  861-889   <- core (oral tongue)
    #   39 Oropharyngeal Cancer         893-941   <- core (base of tongue)
    #   40 Nasopharyngeal Carcinoma     944-968
    #   41 Larynx and Hypopharynx       971-998
    #   42 Sinonasal Cancer            1000-1037
    #   43 Salivary Gland Malignancies 1040-1060
    #   44 Thyroid Cancer              1063-1084
    #   45 Unknown H&N Primary Site    1086-1092
    #   46 Management of the Neck      1096-1125 <- core support (nodal CTV)
    windows:
      - {start: 848, end: 1125, label: "Section III: Head and Neck disease sites"}

    exclude_windows:
      - {start: 1, end: 30, label: "Front matter / contributors"}

    # Running header carries chapter number, chapter title and printed page.
    # In reading order these land on TWO separate lines, not one:
    #   "CHAPTER 38 Oral Cavity" / "611"        (recto)
    #   "612" / "SECTION III Disease Sites"     (verso)
    # so the page number is matched separately as a bare-number line adjacent
    # to the chapter/section line.
    running_header_regex: '^\s*CHAPTER\s+(?P<num>\d{1,3})\s+(?P<title>[^\d].*?)\s*$'
    running_footer_regex: '^\s*SECTION\s+[IVX]+\s+(?P<title>.+?)\s*$'
    printed_page_regex: '^\s*(?P<page>\d{1,4}(?:\.e\d+)?)\s*$'


  - id: mdanderson
    title: "The MD Anderson Surgical Oncology Handbook"
    short: "MD Anderson"
    path: "data/MD_Anderson_Surgical_Oncology_Handbook.pdf"
    pages: 1160

    # Layout: single-column prose with a clean PDF outline ("N Title" for
    # all 25 chapters), so the outline supplies the chapter map.
    has_printed_page_numbers: false
    strip_patterns: []

    # Tongue-mode window only (chapter 6, Cancer of the Head and Neck).
    windows:
      - {start: 280, end: 323, label: "Chapter 6: Cancer of the Head and Neck"}

    exclude_windows:
      - {start: 1073, end: 1160, label: "Back-of-book index"}
      - {start: 1, end: 21, label: "Front matter / contributors / contents"}

  - id: imaging
    title: "Oncologic Imaging: A Multidisciplinary Approach"
    short: "Oncologic Imaging"
    path: "data/Oncologic_Imaging_Multidisciplinary_Approach.pdf"
    pages: 865

    has_printed_page_numbers: false
    strip_patterns: []

    # The PDF's embedded outline is unusable (chapter titles mixed with
    # section headings and OCR debris), so chapters come from this map. It was
    # read off the running headers: every body page of chapter N carries
    # "N * <chapter title>", and the opener page sits two pages before the
    # first such header (the page between carries the section banner).
    use_pdf_outline: false
    windows: []

    exclude_windows:
      - {start: 857, end: 865, label: "Back-of-book index"}
      - {start: 1, end: 12, label: "Front matter / contributors"}

    chapter_map:
      - {num: 1, title: "A Multidisciplinary Approach to Cancer: A Radiologist’s View", start: 13, end: 18}
      - {num: 2, title: "A Multidisciplinary Approach to Cancer: A Surgeon’s View", start: 19, end: 24}
