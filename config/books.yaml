      - {num: 14, title: "Esophageal Cancer", start: 215, end: 234}
      - {num: 15, title: "Gastric Carcinoma", start: 235, end: 250}
      - {num: 16, title: "Small Bowel Malignant Tumors", start: 251, end: 269}
      - {num: 17, title: "Colorectal Cancer", start: 270, end: 289}
