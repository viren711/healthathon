# Content Studio configuration: turning a physician's brief into a draft
# article. Read by writer/studio.py and app/views/content_studio.py.
#
# The writer shares the llama.cpp router with the Oncology Reference page
# (config/models.ini). The router keeps ONE model resident at a time, so
# starting to write unloads the reference model and asking a reference
# question unloads the writer. Nothing here needs to know about that -- it
# just asks for a model by name.

# Writer models offered in the UI, in order; the first one whose GGUF file is
# present is the default. `id` must match a section name in config/models.ini.
#
# Chosen by benchmark on the target CPU (Ryzen 5 5600G, 6 cores, no GPU), two
# briefs each -- a patient blog and a clinician article -- read as a
# clinician would:
#
#   Qwen3.5-4B   ~5.0 tok/s  110 s for 400 words. DEFAULT. On the clinical
#                brief it had the subsites, the full ACIP schedule (incl.
#                shared decision-making at 27-45) and a properly hedged
#                evidence section; imprecisions, nothing inverted.
#   Qwen3-4B     ~5.9 tok/s   95 s for 400 words. Faster, but on the same
#                brief it said HPV-positive oropharyngeal cancer is LESS
#                likely to involve nodes at diagnosis (it is the reverse) and
#                named superseded vaccine formulations.
#
# For content a physician publishes, accuracy is worth the extra 15 s.
# Both need review; neither is offered as finished copy.
#
# Qwen3.5 thinks silently by default: left on, it spent 705 words reasoning,
# hit the token cap and delivered a 171-word article. `extra_body` turns that
# off on every request -- do not remove it.
models:
  - id: qwen3.5-4b
    label: "Recommended — Qwen3.5-4B (more accurate)"
    file: models/gguf/Qwen3.5-4B-Q4_K_M.gguf
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  - id: qwen3-4b-instruct
    label: "Faster — Qwen3-4B"
    file: models/gguf/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
    extra_body: {}

temperature: 0.7

# Length presets. Every generated token costs ~0.17-0.2 s on this CPU, so
# "Long" is capped where a draft still arrives in a few minutes.
lengths:
  Short (~300 words): 300
  Medium (~600 words): 600
  Long (~1000 words): 1000

# Token budget per requested word, including Markdown and headings. The cap
# is sized ABOVE the target so the model reaches its own ending; a draft that
# still hits the cap is trimmed back to its last complete paragraph rather
# than left mid-sentence.
tokens_per_word: 1.6
token_headroom: 200

# ---------------------------------------------------------------------------
# The fixed questions every brief gets. Topic-specific follow-ups are
# generated by the model on top of these (see followups below).
# ---------------------------------------------------------------------------
article_types:
  Patient-education blog post: >-
    Plain language for the general public. Short paragraphs, H2 sections,
    practical and reassuring. Explain what it is, why it matters, what to
    watch for and when to see a doctor.
  Patient handout: >-
    Very plain language, roughly an 8th-grade reading level. Mostly short
    bullet points. Close with a short "questions to ask your doctor" list.
  Professional article for clinicians: >-
    Precise clinical terminology, concise, no oversimplification. Organise
    around clinical relevance and practical implications for practice.
  Newsletter or opinion piece: >-
    A physician's own voice; first person is fine. An engaging opening, a
    clear point of view, and a practical takeaway.

audiences:
  - Patients and the general public
  - Patients recently diagnosed, and their families
  - Caregivers
  - Medical students
  - Fellow clinicians

tones:
  - Warm and reassuring
  - Neutral and informative
  - Formal and clinical
  - Motivating and encouraging

# Appended verbatim -- never generated -- when the physician ticks the box.
disclaimer: >-
  This article is for general information only and does not replace
  personal medical advice. If you have symptoms or concerns, please speak
  with your doctor.

# ---------------------------------------------------------------------------
# Generated follow-up questions
# ---------------------------------------------------------------------------
followups:
  count: 3
  # Used when the model is unreachable or returns something unparseable, so
  # the flow never stalls on a failed generation.
  fallback:
    - "Is there a patient scenario or common question you would like the article to open with?"
    - "Which misconceptions about this topic do you hear most often from patients?"
    - "Is there anything specific to your practice, region or patient population the article should reflect?"

# ---------------------------------------------------------------------------
# Memory
# ---------------------------------------------------------------------------
# The reference page's retrieval models (embedder, reranker, FAISS, BM25) sit
# in the portal process: +1.21 GB measured. Releasing them only returns
# ~0.56 GB -- PyTorch's runtime stays resident -- and reloading costs
# 15-35 s the next time the reference page is used. So they are released only
# when free memory is genuinely short, not on every visit to the studio.
release_reference_below_gb: 5.0
