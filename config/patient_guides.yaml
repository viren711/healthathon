# Registry of the NCCN Guidelines for Patients indexed by the Patient Portal.
#
# One entry per PDF in data/nccn/ (copied from the NCCN patient resources,
# https://www.nccn.org/patientresources/patient-resources/guidelines-for-patients).
# These are copyrighted; like the textbooks, they stay local and are never
# committed (data/, corpus/ and artifacts/ are gitignored).
#
#   id           stable key; used as the chunk `pathology` so the retriever's
#                existing scope filter narrows a search to one guide
#   category     one of the four NCCN folders; used as the chunk `organ_system`
#                so a search can be narrowed to a whole topic area
#   pathologies  the Knowledge Assistant's taxonomy ids (config/organ_systems.yaml)
#                this guide is about, for linking the two tools; empty for
#                guides that are not about one disease
#   year         edition, shown in every citation

categories:
  detection_prevention: Detection, prevention & risk reduction
  treatment: Treatment by cancer type
