  - q: "What is granular cell myoblastoma of the tongue?"
    expect_pages: {devita: [1026]}

# About tongue cancer, but outside what these two textbooks contain.
# Correct behaviour is abstention, not a plausible-sounding answer.
unanswerable:
  - q: "What were the results of the 2024 KEYNOTE-689 trial in resectable tongue cancer?"
  - q: "What is the NCCN 2025 recommended first-line immunotherapy for metastatic tongue cancer?"
  - q: "How much does proton therapy for tongue cancer cost in India?"
  - q: "Which hospital in Mumbai has the best outcomes for glossectomy?"
  - q: "What is the five-year survival of tongue cancer in patients treated with CAR-T therapy?"
  - q: "What did the 2023 Indian national tongue cancer registry report as incidence?"
  - q: "Which gene therapy is approved for oral tongue squamous cell carcinoma?"
  - q: "What is the recommended post-operative physiotherapy schedule in weeks after hemiglossectomy?"

# Broad, plainly-phrased questions of the kind users actually type. These are
# all answerable from the books, but they retrieve LOWER cross-encoder scores
# than a precise question does, because no single passage restates them. They
# exist to stop the grounding threshold being calibrated on a diet of narrow,
# well-formed questions and then refusing ordinary ones.
answerable_broad:
  - q: "state major causes of skin cancer"
  - q: "What causes skin cancer?"
  - q: "What are the main risk factors for lung cancer?"
  - q: "causes of oral cancer"
  - q: "What causes breast cancer?"
  - q: "major risk factors for colorectal cancer"
  - q: "how is cervical cancer prevented"
  - q: "what are the symptoms of pancreatic cancer"
  - q: "overview of prostate cancer treatment"
  - q: "what is brachytherapy"
  - q: "explain radiation late effects"
  - q: "what causes cancer of the oesophagus"

# Covered by the books, but outside the tongue chapters. The topic gate must
# let these through -- refusing them is the bug that full-book indexing was
# meant to fix. Whether the answer is good is the grounding gate's problem;
# this bucket only asserts "not refused as out of scope".
in_scope_other:
  - q: "How do I treat prostate cancer?"
  - q: "What is the standard chemotherapy for metastatic breast cancer?"
  - q: "What is the treatment for glioblastoma multiforme?"
  - q: "Explain the staging of non-small cell lung cancer."
  - q: "How is pancreatic cancer diagnosed?"
  - q: "What is the linear quadratic model in radiobiology?"
  - q: "What are the dose constraints for the spinal cord?"
  - q: "How is cervical cancer treated with chemoradiation?"
  - q: "What is the management of febrile neutropenia?"
  - q: "How is early glottic laryngeal cancer treated?"
  - q: "What is the role of proton therapy in paediatric tumours?"
  - q: "How are Hodgkin lymphomas staged?"

# Nothing to do with these textbooks. Must be refused before retrieval.
off_topic:
  - q: "Write me a poem about the sea."
  - q: "What is the capital of France?"
  - q: "How do I fix a Python ImportError?"
  - q: "What is the best diet for weight loss?"
  - q: "Tell me about the history of the Roman Empire."
  - q: "Who won the football World Cup in 1998?"
  - q: "How do I change a tyre on a car?"
  - q: "What is the recipe for a chocolate cake?"
  - q: "Explain how a transformer neural network works."
  - q: "What is the weather forecast for tomorrow?"
