# Evaluation set for scripts/04_evaluate.py.
#
# Four buckets, because the platform has four distinct obligations:
#   answerable     -> must answer, citing the right part of the books
#   in_scope_other -> covered by the books but outside the tongue chapters;
#                     the topic gate must NOT refuse these. No page
#                     expectations -- this bucket tests scope, not recall.
#   unanswerable   -> plausible and on-topic, but the books do not cover it;
#                     the app MUST abstain instead of improvising
#   off_topic      -> nothing to do with these textbooks; MUST be refused
#
# `expect_pages` lists PDF pages whose content should appear among the
# retrieved chunks. They were read off the source PDFs, not guessed.
#
# NOTE: since the corpus went to full-book mode (selection.mode: full) the
# books cover every disease site, so questions about prostate, breast, lung
# or glioblastoma are IN scope and moved from off_topic to in_scope_other.
# Only genuinely non-oncological questions belong in off_topic now.

answerable:
  - q: "What is the lymphatic drainage of the oral tongue?"
    expect_pages: {devita: [1026], gunderson: [871, 872]}
  - q: "Which are the first echelon nodes for oral tongue cancer?"
    expect_pages: {devita: [1026]}
  - q: "What percentage of oral tongue lesions are squamous cell carcinomas?"
    expect_pages: {devita: [1026], gunderson: [872]}
  - q: "At what depth of invasion should neck dissection be considered in oral tongue cancer?"
    expect_pages: {devita: [1026, 1027]}
  - q: "How are early T1 and T2 oral tongue cancers treated?"
    expect_pages: {devita: [1026], gunderson: [872, 873]}
  - q: "What is a partial glossectomy used for?"
    expect_pages: {devita: [1026]}
  - q: "What proportion of oral tongue cancer patients have clinically positive nodes at diagnosis?"
    expect_pages: {devita: [1026], gunderson: [872]}
  - q: "Where do most oral tongue cancers begin?"
    expect_pages: {devita: [1026], gunderson: [872]}
  - q: "What are the symptoms of oral tongue carcinoma?"
    expect_pages: {devita: [1026], gunderson: [872]}
  - q: "How is base of tongue cancer treated with radiation?"
    expect_pages: {devita: [1039]}
  - q: "What is the surgical treatment for base of tongue carcinoma?"
    expect_pages: {devita: [1039]}
  - q: "What muscles make up the oral tongue?"
    expect_pages: {gunderson: [871]}
  - q: "Which nerve supplies motor function to the tongue?"
    expect_pages: {gunderson: [871]}
  - q: "What is the role of interstitial implant in oral tongue cancer?"
    expect_pages: {devita: [1027], gunderson: [872]}
  - q: "How is the N0 neck managed in head and neck squamous cell carcinoma?"
    expect_pages: {devita: [1005, 1006]}
  - q: "What is the differential diagnosis for an oral tongue lesion?"
    expect_pages: {devita: [1026]}
  - q: "How does oral tongue cancer in young patients differ?"
    expect_pages: {devita: [986]}
  - q: "What is the significance of HPV in oropharyngeal cancer?"
    expect_pages: {devita: [986]}
  - q: "What chemotherapy agents are used in recurrent or metastatic head and neck cancer?"
    expect_pages: {devita: [1007, 1008]}
  - q: "How is swallowing assessed after treatment for head and neck cancer?"
    expect_pages: {devita: [1098]}
  - q: "What are skip metastases in oral tongue cancer?"
    expect_pages: {devita: [1026]}
  - q: "How are moderately advanced T2 and T3 tongue cancers managed?"
    expect_pages: {gunderson: [872]}
  - q: "What is the prognosis for T4 tongue cancer?"
    expect_pages: {gunderson: [872]}
  - q: "What clinical target volume is recommended for oral cavity tumours in the neck?"
