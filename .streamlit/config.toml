# Portal theme. Read by `streamlit run` from the repository root (./start).

[theme]
# Always light, whatever the browser or system prefers. The sun/moon button at
# top right switches a page to dark (it inverts the light look, see
# app/streamlit_app.py), and remembers the choice in the browser.
base = "light"
primaryColor = "#0F766E"          # clinical teal: primary buttons, links, active nav
backgroundColor = "#FAFDFC"
secondaryBackgroundColor = "#EAF4F2"
textColor = "#12302E"
showWidgetBorder = true
baseRadius = "0.6rem"

[client]
toolbarMode = "minimal"
